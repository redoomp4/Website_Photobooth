<!DOCTYPE html>
<html>
<head>
  <title>Analyze Frame</title>
</head>
<body>
  <canvas id="canvas" width="591" height="1772"></canvas>
  <script>
    const img = new Image();
    img.src = 'Spidey Strip Photobooth 1.png';
    img.onload = () => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      const width = canvas.width;
      const height = canvas.height;

      // Let's sample colors down the vertical center line to see what values we get
      const samples = [];
      const midX = Math.floor(width / 2);
      for (let y = 0; y < height; y += 10) {
        const idx = (y * width + midX) * 4;
        samples.push({ y, r: data[idx], g: data[idx+1], b: data[idx+2] });
      }
      
      // Let's find vertical segments that are very dark (say, R < 50, G < 50, B < 50)
      const boxes = [];
      let inBox = false;
      let boxStart = 0;
      
      for (let y = 0; y < height; y++) {
        const idx = (y * width + midX) * 4;
        const r = data[idx];
        const g = data[idx+1];
        const b = data[idx+2];
        const isDark = r < 50 && g < 50 && b < 50;
        
        if (isDark && !inBox) {
          inBox = true;
          boxStart = y;
        } else if (!isDark && inBox) {
          inBox = false;
          boxes.push({ y1: boxStart, y2: y - 1 });
        }
      }
      if (inBox) {
        boxes.push({ y1: boxStart, y2: height - 1 });
      }

      const finalBoxes = [];
      for (const box of boxes) {
        if (box.y2 - box.y1 < 100) continue;

        const midY = Math.floor((box.y1 + box.y2) / 2);
        let x1 = 0;
        let x2 = width - 1;

        for (let x = midX; x >= 0; x--) {
          const idx = (midY * width + x) * 4;
          const isDark = data[idx] < 50 && data[idx+1] < 50 && data[idx+2] < 50;
          if (!isDark) {
            x1 = x + 1;
            break;
          }
        }

        for (let x = midX; x < width; x++) {
          const idx = (midY * width + x) * 4;
          const isDark = data[idx] < 50 && data[idx+1] < 50 && data[idx+2] < 50;
          if (!isDark) {
            x2 = x - 1;
            break;
          }
        }

        finalBoxes.push({
          x: x1,
          y: box.y1,
          width: x2 - x1 + 1,
          height: box.y2 - box.y1 + 1
        });
      }

      console.log("FINAL DETECTED BOXES:", JSON.stringify(finalBoxes));
      
      const resDiv = document.createElement('div');
      resDiv.id = 'results';
      resDiv.innerText = JSON.stringify({ samples: samples.slice(0, 30), finalBoxes });
      document.body.appendChild(resDiv);
    };
  </script>
</body>
</html>
